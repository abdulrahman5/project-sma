# Admin panel configuration (Decap CMS). Every save becomes a commit on GitHub,
# and Vercel automatically rebuilds the live site (about 1 minute).
backend:
  name: github
  repo: YOUR-GITHUB-USERNAME/sma-website   # <-- change to your GitHub repo
  branch: main
  commit_messages:
    create: "Create {{collection}} “{{slug}}”"
    update: "Update {{collection}} “{{slug}}”"
    delete: "Delete {{collection}} “{{slug}}”"
    uploadMedia: "Upload “{{path}}”"
    deleteMedia: "Delete “{{path}}”"

media_folder: static/images
public_folder: /images
site_url: /
display_url: /
logo_url: /favicon.svg

collections:
  - name: pages
    label: Site Settings & Pages
    editor: { preview: false }
    files:
      - name: site
        label: Site Settings
        file: content/site.json
        fields:
          - { name: name, label: Full name / title, widget: string }
          - { name: shortName, label: Short name (logo), widget: string, hint: "e.g. SMA" }
          - { name: office, label: Office, widget: string }
          - { name: constituency, label: Constituency, widget: string }
          - { name: state, label: State, widget: string }
          - { name: party, label: Party, widget: string }
          - { name: siteUrl, label: Website address, widget: string, hint: "e.g. https://saidumusa.com — used for sharing previews and the sitemap" }
          - { name: seoDescription, label: Search engine description, widget: text }
          - name: colors
            label: Brand colours
            widget: object
            fields:
              - { name: primary, label: Primary colour, widget: color }
              - { name: accent, label: Accent colour, widget: color }
          - name: hero
            label: Top banner
            widget: object
            fields:
              - { name: badge, label: Badge text, widget: string }
              - { name: headline, label: Headline, widget: string }
              - { name: highlight, label: Highlighted word(s), widget: string }
              - { name: intro, label: Intro text, widget: text }
              - { name: image, label: Portrait photo, widget: image, required: false, hint: "Portrait orientation works best (4:5)" }
          - name: stats
            label: Key numbers
            widget: list
            max: 4
            fields:
              - { name: value, label: Number, widget: string }
              - { name: label, label: Label, widget: string }
          - { name: quote, label: Signature quote, widget: text, required: false, hint: "Leave empty to hide the quote section" }
          - name: contact
            label: Contact details
            widget: object
            fields:
              - { name: address, label: Office address, widget: string }
              - { name: email, label: Email, widget: string }
              - { name: phone, label: Phone / WhatsApp, widget: string }
          - name: socials
            label: Social media links (leave empty to hide)
            widget: object
            fields:
              - { name: facebook, label: Facebook URL, widget: string, required: false }
              - { name: x, label: X / Twitter URL, widget: string, required: false }
              - { name: instagram, label: Instagram URL, widget: string, required: false }
              - { name: youtube, label: YouTube URL, widget: string, required: false }
              - { name: tiktok, label: TikTok URL, widget: string, required: false }
          - { name: formEndpoint, label: Contact form endpoint, widget: string, required: false, hint: "Paste your Formspree form URL (e.g. https://formspree.io/f/xxxx) so messages reach your inbox" }

      - name: about
        label: About & Timeline
        file: content/about.json
        fields:
          - { name: heading, label: Heading, widget: string }
          - { name: image, label: Photo, widget: image, required: false }
          - { name: body, label: Biography, widget: markdown, buttons: [bold, italic, link, bulleted-list, numbered-list], editor_components: [] }
          - name: facts
            label: Quick facts
            widget: list
            fields:
              - { name: label, label: Label, widget: string }
              - { name: value, label: Value, widget: string }
          - name: timeline
            label: Timeline / milestones
            widget: list
            fields:
              - { name: year, label: Year, widget: string }
              - { name: title, label: Title, widget: string }
              - { name: text, label: Description, widget: text }

      - name: agenda
        label: Agenda / Priorities
        file: content/agenda.json
        fields:
          - { name: heading, label: Heading, widget: string }
          - { name: intro, label: Intro, widget: text, required: false }
          - name: items
            label: Priorities
            widget: list
            fields:
              - name: icon
                label: Icon
                widget: select
                options: [education, health, agriculture, jobs, infrastructure, finance, water, security, community, power]
              - { name: title, label: Title, widget: string }
              - { name: text, label: Description, widget: text }

  - name: projects
    label: Projects
    label_singular: Project
    folder: content/projects
    format: json
    extension: json
    create: true
    slug: "{{slug}}"
    summary: "{{title}} — {{category}} ({{year}})"
    sortable_fields: [order, title, year]
    editor: { preview: false }
    fields:
      - { name: title, label: Project name, widget: string }
      - name: category
        label: Category
        widget: select
        options: [Education, Health, Infrastructure, Empowerment, Agriculture, Water, Security, Other]
      - { name: location, label: Location, widget: string, required: false }
      - { name: year, label: Year, widget: string, required: false }
      - { name: summary, label: Short description, widget: text }
      - { name: image, label: Photo, widget: image, required: false }
      - { name: order, label: Display order, widget: number, value_type: int, default: 100, hint: "Lower numbers appear first" }

  - name: news
    label: News & Press
    label_singular: News post
    folder: content/news
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{title}} ({{year}}-{{month}}-{{day}})"
    sortable_fields: [date, title]
    editor: { preview: false }
    fields:
      - { name: title, label: Headline, widget: string }
      - { name: date, label: Date, widget: datetime }
      - { name: summary, label: Summary (shown on cards), widget: text }
      - { name: image, label: Cover photo, widget: image, required: false }
      - { name: draft, label: Draft (hide from site), widget: boolean, default: false, required: false }
      - { name: body, label: Full story, widget: markdown }
